<section class="td-page-hero">
  <h1>צור קשר</h1>
  <p>נשמח לעזור לתכנן את הנסיעה הבאה שלכם. התקשרו, שלחו וואטסאפ או מייל – ונחזור אליכם.</p>
</section>

<div class="td-section">
  <div class="td-grid td-grid--3">
    <a class="td-card td-contact" href="tel:{{PHONE}}">
      <div class="td-contact__icon">{{ICON_PHONE}}</div>
      <h2>טלפון</h2>
      <p dir="ltr">{{PHONE}}</p>
    </a>
    <a class="td-card td-contact" href="{{WA}}" target="_blank" rel="noopener noreferrer">
      <div class="td-contact__icon">{{WA_SVG}}</div>
      <h2>וואטסאפ</h2>
      <p>שלחו הודעה ונחזור אליכם</p>
    </a>
    <a class="td-card td-contact" href="mailto:{{EMAIL}}">
      <div class="td-contact__icon">{{ICON_MAIL}}</div>
      <h2>אימייל</h2>
      <p dir="ltr" style="word-break: break-all">{{EMAIL}}</p>
    </a>
  </div>

  <div class="td-actions" style="margin-top: 2.5rem">
    <a class="td-btn td-btn--outline" href="{{GOOGLE_REVIEW}}" target="_blank" rel="noopener noreferrer">{{ICON_STAR}} דרגו אותנו בגוגל מפות</a>
  </div>
</div>
